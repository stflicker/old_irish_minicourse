name: Old Irish daily publication

on:
  schedule:
    # 02:17 JST (17:17 UTC on the previous date). Leave a buffer for late schedules.
    - cron: '17 17 * * *'
  workflow_dispatch:
  issues:
    types: [opened]
  push:
    paths:
      - 'FIRST_28_DAYS.md'
      - 'lessons/**'
      - 'scripts/**'
      - 'docs/style.css'
      - 'docs/tables.css'
      - 'docs/app.js'
      - 'docs/index.html'
      - '.github/workflows/daily-publish.yml'

# Generate and publish the Pages artifact directly. A commit made with the
# workflow GITHUB_TOKEN does not itself trigger a branch-based Pages build.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: old-irish-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[Old Irish Feedback] '))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install small site-build dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Apply the one-time reviewed paradigm revision
        run: python scripts/revise_paradigms.py
      - name: Import owner-confirmed study feedback
        if: github.event_name == 'issues'
        run: python scripts/import_issue_feedback.py
      - name: Write scheduled publication record
        if: github.event_name != 'issues'
        run: python scripts/daily_publish.py
      - name: Build HTML site from curriculum and authored Markdown lessons
        run: python scripts/build_site.py
      - name: Validate all 28 lessons, table effects, semantics and migration
        run: |
          python scripts/test_tables.py
          node --check docs/app.js
      - name: Commit generated site, revised source and progress log
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs lessons scripts/build_site.py PROGRESS.md
          if ! git diff --cached --quiet; then
            git commit -m "daily: rebuild Old Irish site and record"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy interactive site
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify Day 005 revision on the live public site
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          URL="${PAGES_URL%/}/days/005.html?v=${GITHUB_SHA}"
          grep -Fq 'Short and long neuter plurals' docs/days/005.html
          if grep -Fq 'not another nominative' docs/days/005.html; then
            echo "::error::Old Day 005 sentence still present in generated HTML"
            exit 1
          fi
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --location --silent --show-error --max-time 15 --header 'Cache-Control: no-cache' "$URL" -o /tmp/day005-live.html; then
              if grep -Fq 'Short and long neuter plurals' /tmp/day005-live.html && ! grep -Fq 'not another nominative' /tmp/day005-live.html; then
                echo "Verified revised Day 005 publicly at: $URL"
                exit 0
              fi
            fi
            sleep 12
          done
          echo "::error::Public Day 005 still has stale content: $URL"
          exit 1
